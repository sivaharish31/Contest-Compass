spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/contestradar_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DATABASE_USERNAME:contestradar}
    password: ${DATABASE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: false

contestradar:
  sync:
    interval-ms: 999999999
  reminder:
    check-interval-ms: 999999999
  providers:
    mock-enabled: false
