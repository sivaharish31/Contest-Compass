spring:
  application:
    name: contest-radar

  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/contestradar?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DATABASE_USERNAME:contestradar}
    password: ${DATABASE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
      timeout: 24h

contestradar:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  sync:
    interval-ms: ${SYNC_INTERVAL_MS:900000}
  reminder:
    check-interval-ms: ${REMINDER_CHECK_INTERVAL_MS:60000}
    default-lead-minutes: ${REMINDER_LEAD_MINUTES:10}
  mail:
    from: ${MAIL_FROM:noreply@contestradar.dev}
  providers:
    mock-enabled: ${MOCK_PROVIDER_ENABLED:false}
  http:
    connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${HTTP_READ_TIMEOUT_MS:30000}
